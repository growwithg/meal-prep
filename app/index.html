<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep — weekly meal prep</title>
<meta name="description" content="Two lunch meals, five workdays, one Sunday cook.">
<meta name="theme-color" content="#eaeff6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080b10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34c759"/><stop offset="100%" stop-color="#0a84c1"/>
    </linearGradient>
  </defs>
</svg>

<div class="shell">
  <header class="masthead">
    <p class="eyebrow" id="weekId">Loading</p>
    <h1>Prep</h1>
    <p class="dateline" id="dateline">Fetching this week’s plan…</p>
  </header>

  <main>
    <section id="view-week"  class="stack" aria-label="This week"></section>
    <section id="view-shop"  class="stack" aria-label="Grocery list" hidden></section>
    <section id="view-cook"  class="stack" aria-label="Sunday cook" hidden></section>
  </main>
</div>

<nav class="tabs glass" role="tablist" aria-label="Sections">
  <span class="thumb" aria-hidden="true"></span>
  <button role="tab" data-view="week" aria-selected="true" aria-controls="view-week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
    </svg>
    Week
  </button>
  <button role="tab" data-view="shop" aria-selected="false" aria-controls="view-shop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h16l-1.3 11.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8L4 7Z"/><path d="M8.5 7a3.5 3.5 0 0 1 7 0"/>
    </svg>
    Shop
    <span class="badge-count" id="shopBadge" hidden>0</span>
  </button>
  <button role="tab" data-view="cook" aria-selected="false" aria-controls="view-cook">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 13c4.4 0 8 1.3 8 3v2H4v-2c0-1.7 3.6-3 8-3Z"/><path d="M12 13V9"/><path d="M9 6.5a3 3 0 0 1 6 0"/>
    </svg>
    Cook
  </button>
</nav>

<script src="data/plan.js"></script>
<script src="app.js"></script>
</body>
</html>
